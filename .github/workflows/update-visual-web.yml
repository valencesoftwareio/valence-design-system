name: Update Visual Web Baselines

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: update-visual-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.state' <<< "$pr")" = "open"
          test "$(jq -r '.draft' <<< "$pr")" = true
          test "$(jq -r '.head.repo.full_name' <<< "$pr")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head.ref' <<< "$pr")" != "main"
          echo "head_ref=$(jq -r '.head.ref' <<< "$pr")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' <<< "$pr")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pull-request.outputs.head_sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual:web:update

      - name: Commit baselines
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.pull-request.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.state' <<< "$pr")" = "open"
          test "$(jq -r '.draft' <<< "$pr")" = true
          test "$(jq -r '.head.sha' <<< "$pr")" = "$HEAD_SHA"
          git add tests/visual/web/baselines
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: update web visual baselines"
          git push --force-with-lease="refs/heads/$HEAD_REF:$HEAD_SHA" origin "HEAD:refs/heads/$HEAD_REF"
