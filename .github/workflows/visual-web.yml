name: Visual

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run
        type: choice
        options:
          - all
          - web
          - android
          - ios
        default: all
      scope:
        description: Component name or * for all components
        type: string
        default: '*'

permissions:
  contents: read

concurrency:
  group: visual-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      android_scope: ${{ steps.scope.outputs.android_scope }}
      ios_scope: ${{ steps.scope.outputs.ios_scope }}
      web_scope: ${{ steps.scope.outputs.web_scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Find affected components
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MANUAL_SCOPE: ${{ inputs.scope }}
        run: |
          if test "${{ github.event_name }}" = workflow_dispatch; then
            android_scope=''
            ios_scope=''
            web_scope=''
            case "${{ inputs.platform }}" in
              all)
                android_scope="$MANUAL_SCOPE"
                ios_scope="$MANUAL_SCOPE"
                web_scope="$MANUAL_SCOPE"
                ;;
              android) android_scope="$MANUAL_SCOPE" ;;
              ios) ios_scope="$MANUAL_SCOPE" ;;
              web) web_scope="$MANUAL_SCOPE" ;;
            esac
          elif [[ "${{ github.head_ref }}" == release-please--* ]]; then
            android_scope=''
            ios_scope=''
            web_scope=''
          elif test -z "$BASE_SHA"; then
            android_scope='*'
            ios_scope='*'
            web_scope='*'
          else
            changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            android_scope=$(node scripts/list-affected-visual-components.mjs android <<< "$changed_files")
            ios_scope=$(node scripts/list-affected-visual-components.mjs ios <<< "$changed_files")
            web_scope=$(node scripts/list-affected-visual-components.mjs web <<< "$changed_files")
          fi
          echo "android_scope=$android_scope" >> "$GITHUB_OUTPUT"
          echo "ios_scope=$ios_scope" >> "$GITHUB_OUTPUT"
          echo "web_scope=$web_scope" >> "$GITHUB_OUTPUT"

  compare:
    needs: changes
    if: needs.changes.outputs.web_scope != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual:web
        env:
          VISUAL_COMPONENTS: ${{ needs.changes.outputs.web_scope }}

      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-web-differences
          path: test-results/visual-web/**/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload web test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-web-report
          path: test-results/web-results.json
          if-no-files-found: ignore
          retention-days: 14

  android:
    needs: changes
    if: needs.changes.outputs.android_scope != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.1.0
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter native-storybook... build
      - run: pnpm --dir apps/native-storybook exec expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Install Maestro
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --output maestro.zip \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --output maestro-checksums.txt \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/checksums_sha256.txt
          grep ' maestro.zip$' maestro-checksums.txt | sha256sum --check
          unzip -q maestro.zip -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture Android stories
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        env:
          GRADLE_OPTS: -Dorg.gradle.caching=true
          VISUAL_COMPONENTS: ${{ needs.changes.outputs.android_scope }}
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          profile: pixel_6
          script: |
            EXPO_PUBLIC_VISUAL_TEST=true pnpm --dir apps/native-storybook exec expo run:android --variant release --no-bundler
            ./scripts/capture-native-visuals.sh android test-results/visual-native/current/android
            ./scripts/test-native-interactions.sh android test-results/interactions/android

      - name: Compare Android screenshots
        run: >-
          node scripts/compare-native-visuals.mjs android
          test-results/visual-native/current/android
          tests/visual/native/android/baselines
          test-results/visual-native/differences

      - name: Upload Android differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-android-differences
          path: test-results/visual-native/differences/android/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android captures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-android-captures
          path: test-results/visual-native/current/android/*.png
          retention-days: 1

      - name: Upload Android test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-android-report
          path: test-results/interactions/android/report.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android interaction artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-android-interactions
          path: test-results/interactions/android/artifacts
          if-no-files-found: ignore
          retention-days: 14

  ios:
    needs: changes
    if: needs.changes.outputs.ios_scope != ''
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Read Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'apps/native-storybook/app.json', 'apps/native-storybook/package.json') }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter native-storybook... build

      - name: Install Maestro
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --output maestro.zip \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --output maestro-checksums.txt \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/checksums_sha256.txt
          grep ' maestro.zip$' maestro-checksums.txt | shasum --algorithm 256 --check
          unzip -q maestro.zip -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"

      - name: Capture iOS stories
        env:
          VISUAL_COMPONENTS: ${{ needs.changes.outputs.ios_scope }}
        run: |
          device_id=$(xcrun simctl list devices available --json |
            jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$device_id"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl spawn "$device_id" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
          xcrun simctl spawn "$device_id" notifyutil -p com.apple.Accessibility.ReduceMotionStatusDidChange
          EXPO_PUBLIC_VISUAL_TEST=true pnpm --dir apps/native-storybook exec expo run:ios \
            --configuration Release --device generic --output "$RUNNER_TEMP/native-storybook"
          app_path=$(find "$RUNNER_TEMP/native-storybook" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app_path"
          xcrun simctl install "$device_id" "$app_path"
          xcrun simctl launch "$device_id" io.valencesoftware.storybook
          ./scripts/capture-native-visuals.sh ios test-results/visual-native/current/ios
          ./scripts/test-native-interactions.sh ios test-results/interactions/ios

      - name: Compare iOS screenshots
        run: >-
          node scripts/compare-native-visuals.mjs ios
          test-results/visual-native/current/ios
          tests/visual/native/ios/baselines
          test-results/visual-native/differences

      - name: Upload iOS differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-ios-differences
          path: test-results/visual-native/differences/ios/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload iOS captures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-ios-captures
          path: test-results/visual-native/current/ios/*.png
          retention-days: 1

      - name: Upload iOS test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-ios-report
          path: test-results/interactions/ios/report.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload iOS interaction artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-ios-interactions
          path: test-results/interactions/ios/artifacts
          if-no-files-found: ignore
          retention-days: 14

  validation:
    name: Visual validation
    needs: [changes, compare, android, ios]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Check visual results
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          WEB_RESULT: ${{ needs.compare.result }}
        run: |
          test "$CHANGES_RESULT" = success
          for result in "$WEB_RESULT" "$ANDROID_RESULT" "$IOS_RESULT"; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
