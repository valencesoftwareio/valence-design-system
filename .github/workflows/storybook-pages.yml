name: Storybook Pages

on:
  workflow_run:
    workflows: [CI, Visual]
    types: [completed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.name == 'Visual' ||
      (github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      report_available: ${{ steps.trigger.outputs.report_available }}
      trigger_conclusion: ${{ steps.trigger.outputs.conclusion }}
      trigger_pr: ${{ steps.trigger.outputs.pr }}
      trigger_run_id: ${{ steps.trigger.outputs.run_id }}
      trigger_sha: ${{ steps.trigger.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - run: pnpm --filter @valencesoftwareio/react... build
      - run: pnpm --filter @valencesoftwareio/react build-storybook

      - name: Collect current visual differences
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir visual-report-inputs
          gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f per_page=100 |
            jq -r '.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY) | [.number, .head.sha] | @tsv' |
            while IFS=$'\t' read -r pr_number head_sha; do
              run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/visual-web.yml/runs" -f event=pull_request -f status=completed -f head_sha="$head_sha" -f per_page=20 |
                jq --argjson pr_number "$pr_number" '.workflow_runs | map(select(.pull_requests | any(.number == $pr_number))) | sort_by(.run_number) | last')
              if [ "$(jq -r '.conclusion // empty' <<< "$run")" != 'failure' ]; then
                continue
              fi
              run_id=$(jq -r '.id' <<< "$run")
              destination="visual-report-inputs/pr-$pr_number-$head_sha"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" |
                jq -c '.artifacts[] | select(.expired == false and (.name | test("^visual-(web|android|ios)-differences$")))' |
                while IFS= read -r artifact; do
                  artifact_size=$(jq -r '.size_in_bytes' <<< "$artifact")
                  if [ "$artifact_size" -eq 0 ] || [ "$artifact_size" -gt 26214400 ]; then
                    continue
                  fi
                  artifact_id=$(jq -r '.id' <<< "$artifact")
                  archive=$(mktemp)
                  if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$archive"; then
                    python3 scripts/extract-visual-report.py "$archive" "$destination" || rm -rf "$destination"
                  fi
                  rm "$archive"
                done
            done
          node scripts/build-visual-report-site.mjs visual-report-inputs packages/react/storybook-static

      - name: Resolve triggering pull request
        id: trigger
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Visual'
        env:
          GH_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty')
          if [ -z "$pr_number" ]; then
            exit 0
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")
          if [ "$(jq -r '.state' <<< "$pr")" != 'open' ] ||
            [ "$(jq -r '.head.sha' <<< "$pr")" != "$SHA" ] ||
            [ "$(jq -r '.head.repo.full_name' <<< "$pr")" != "$GITHUB_REPOSITORY" ]; then
            exit 0
          fi
          echo "pr=$pr_number" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          if [ -f "packages/react/storybook-static/visual-reports/pr-$pr_number/$SHA/index.html" ]; then
            echo 'report_available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'report_available=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: packages/react/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Storybook and visual reports
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Update pull request
        if: needs.build.outputs.trigger_pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ needs.build.outputs.trigger_conclusion }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PR_NUMBER: ${{ needs.build.outputs.trigger_pr }}
          REPORT_AVAILABLE: ${{ needs.build.outputs.report_available }}
          RUN_ID: ${{ needs.build.outputs.trigger_run_id }}
          SHA: ${{ needs.build.outputs.trigger_sha }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          if [ "$(jq -r '.state' <<< "$pr")" != 'open' ] || [ "$(jq -r '.head.sha' <<< "$pr")" != "$SHA" ]; then
            exit 0
          fi
          marker='<!-- visual-web-status -->'
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          page_root=${PAGE_URL%/}
          short_sha=${SHA:0:7}
          if [ "$CONCLUSION" = 'success' ]; then
            result='✅ Visual regression passed.'
            details="Screenshots matched for commit \`$short_sha\`. [View workflow]($run_url)."
          elif [ "$REPORT_AVAILABLE" = 'true' ]; then
            result='❌ Visual regression found differences.'
            details="Commit \`$short_sha\`. [Review visual changes]($page_root/visual-reports/pr-$PR_NUMBER/$SHA/) · [View workflow]($run_url)"
          else
            result='❌ Visual regression failed before a visual report could be generated.'
            details="Commit \`$short_sha\`. [View workflow and artifacts]($run_url#artifacts)."
          fi
          body=$(printf '%s\n\n%s\n\n%s' "$marker" "$result" "$details")
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body"
          fi
